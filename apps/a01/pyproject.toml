[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "cdh-a01-preview"
version = "0.5.0"
description = "Coupang Deal Hunter offline Windows manual price manager"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6==6.8.1"]

[project.scripts]
cdh-a01 = "a01_app.main:main"

[tool.setuptools]
packages = ["a01_app"]
