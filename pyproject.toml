[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdh-core"
version = "0.5.0"
description = "Coupang Deal Hunter C01 offline-only pure core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cdh-core-demo = "cdh_core.demo:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

